<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Studio</title>
<script src="vendor/papaparse.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.js"></script>
<style>
/* ===== Studio family themes (shared with Markdown & PDF Studio); Dt accent = #12A06B ===== */
:root,[data-theme="dark"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#1b1b1b;--chrome:#2b2b2b;--chrome2:#323232;--panel:#262626;--line:#111;--border:#3c3c3c;--hover:#3e3e3e;
  --text:#d6d6d6;--dim:#949494;--strong:#fff;--accent:#2fc48d;--accent2:#12a06b;--on-accent:#fff;
  --cta:#12a06b;--cta-hover:#0e8a5b;--cta-radius:12px;--btn-radius:13px;--radius:4px;
  --input-bg:#1e1e1e;--input-border:#4a4a4a;--workarea:#2a2a2a;
  --dd-bg:#303030;--dd-border:#474747;--dd-hover-bg:#12a06b;--dd-hover-fg:#fff;--card-bg:#2d2d2d;--card-border:#393939;--code-bg:#1b1b1b;
  --tab-bg:#262626;--tab-active:#1e1e1e;--tab-ind:inset 0 2px #12a06b;--dock-ind:#e8e8e8;
  --seg-bg:#1e1e1e;--seg-active:#4b4b4b;--btn-active-bg:#1c1c1c;--btn-active-border:#555;
  --thumb:#4a4a4a;--thumb-hover:#5c5c5c;--shadow:0 10px 28px rgba(0,0,0,.55);
  --grid-bg:#1e1e1e;--grid-alt:#222;--grid-line:#333;--grid-head:#2b2b2b;--grid-num:#262626;--sel:rgba(47,196,141,.18);--sel-line:#2fc48d;
  --switch-off:#5a5a5a;--modal-bg:#2c2c2c;--overlay:rgba(0,0,0,.55);--ok:#2d9d78;--warn:#e68619;--danger:#d7373f;
  color-scheme:dark}
[data-theme="light"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#e8e8e8;--chrome:#f8f8f8;--chrome2:#efefef;--panel:#f5f5f5;--line:#cacaca;--border:#dcdcdc;--hover:#e1e1e1;
  --text:#323232;--dim:#6e6e6e;--strong:#000;--accent:#0b8457;--accent2:#12a06b;--on-accent:#fff;
  --cta:#12a06b;--cta-hover:#0e8a5b;--cta-radius:12px;--btn-radius:13px;--radius:4px;
  --input-bg:#fff;--input-border:#b3b3b3;--workarea:#d9d9d9;
  --dd-bg:#fff;--dd-border:#d0d0d0;--dd-hover-bg:#12a06b;--dd-hover-fg:#fff;--card-bg:#fff;--card-border:#dedede;--code-bg:#f2f2f2;
  --tab-bg:#e9e9e9;--tab-active:#fff;--tab-ind:inset 0 2px #12a06b;--dock-ind:#323232;
  --seg-bg:#fff;--seg-active:#dadada;--btn-active-bg:#fff;--btn-active-border:#b3b3b3;
  --thumb:#c2c2c2;--thumb-hover:#a8a8a8;--shadow:0 8px 24px rgba(0,0,0,.18);
  --grid-bg:#fff;--grid-alt:#f7f7f7;--grid-line:#e2e2e2;--grid-head:#f0f0f0;--grid-num:#f5f5f5;--sel:rgba(18,160,107,.14);--sel-line:#12a06b;
  --switch-off:#b3b3b3;--modal-bg:#fff;--overlay:rgba(0,0,0,.35);--ok:#2d9d78;--warn:#e68619;--danger:#d7373f;
  color-scheme:light}
[data-theme="github"]{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --bg:#f6f8fa;--chrome:#f6f8fa;--chrome2:#fff;--panel:#fff;--line:#d1d9e0;--border:#d1d9e0;--hover:#eaeef2;
  --text:#1f2328;--dim:#59636e;--strong:#1f2328;--accent:#0969da;--accent2:#0969da;--on-accent:#fff;
  --cta:#1f883d;--cta-hover:#1a7f37;--cta-radius:6px;--btn-radius:6px;--radius:6px;
  --input-bg:#f6f8fa;--input-border:#d1d9e0;--workarea:#f6f8fa;
  --dd-bg:#fff;--dd-border:#d1d9e0;--dd-hover-bg:#eaeef2;--dd-hover-fg:#1f2328;--card-bg:#fff;--card-border:#d1d9e0;--code-bg:#f6f8fa;
  --tab-bg:#f6f8fa;--tab-active:#fff;--tab-ind:inset 0 -2px #fd8c73;--dock-ind:#fd8c73;
  --seg-bg:#f6f8fa;--seg-active:#fff;--btn-active-bg:#fff;--btn-active-border:#d1d9e0;
  --thumb:#c8d1da;--thumb-hover:#afb8c1;--shadow:0 8px 24px rgba(140,149,159,.25);
  --grid-bg:#fff;--grid-alt:#f6f8fa;--grid-line:#d1d9e0;--grid-head:#f6f8fa;--grid-num:#f6f8fa;--sel:rgba(9,105,218,.12);--sel-line:#0969da;
  --switch-off:#d1d9e0;--modal-bg:#fff;--overlay:rgba(31,35,40,.5);--ok:#1a7f37;--warn:#9a6700;--danger:#d1242f;
  color-scheme:light}
[data-theme="github-dark"]{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --bg:#010409;--chrome:#010409;--chrome2:#0d1117;--panel:#0d1117;--line:#3d444d;--border:#3d444d;--hover:#262c36;
  --text:#f0f6fc;--dim:#9198a1;--strong:#fff;--accent:#4493f8;--accent2:#1f6feb;--on-accent:#fff;
  --cta:#238636;--cta-hover:#29903b;--cta-radius:6px;--btn-radius:6px;--radius:6px;
  --input-bg:#0d1117;--input-border:#3d444d;--workarea:#010409;
  --dd-bg:#151b23;--dd-border:#3d444d;--dd-hover-bg:#262c36;--dd-hover-fg:#f0f6fc;--card-bg:#151b23;--card-border:#3d444d;--code-bg:#0d1117;
  --tab-bg:#010409;--tab-active:#0d1117;--tab-ind:inset 0 -2px #f78166;--dock-ind:#f78166;
  --seg-bg:#0d1117;--seg-active:#262c36;--btn-active-bg:#262c36;--btn-active-border:#3d444d;
  --thumb:#3d444d;--thumb-hover:#656c76;--shadow:0 8px 24px rgba(1,4,9,.75);
  --grid-bg:#0d1117;--grid-alt:#111720;--grid-line:#262c36;--grid-head:#151b23;--grid-num:#0d1117;--sel:rgba(56,139,253,.18);--sel-line:#4493f8;
  --switch-off:#3d444d;--modal-bg:#151b23;--overlay:rgba(1,4,9,.7);--ok:#3fb950;--warn:#d29922;--danger:#f85149;
  color-scheme:dark}

/* App tile: dark fade in dark themes, light fade in light themes (also used for the window/taskbar icon, see native.js) */
:root{--tile-a:#0a4535;--tile-b:#1fbf8f}
[data-theme="light"],[data-theme="github"]{--tile-a:#14a97a;--tile-b:#86ebc8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:clip}
body{background:var(--bg);color:var(--text);font:12px/1.4 var(--font-ui);display:grid;grid-template-rows:32px 40px 1fr 24px;user-select:none}
input,textarea,select{user-select:text}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--thumb);border:3px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background-color:var(--thumb-hover)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* Menu bar */
.menubar{display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--line);position:relative;z-index:50}
.logo{width:40px;height:32px;display:grid;place-items:center}
.logo span{width:22px;height:22px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));color:#fff;font-weight:800;font-size:10px;display:grid;place-items:center;letter-spacing:-.02em}
#menus{display:flex}
.menu{position:relative}
.menu>button{background:none;border:0;padding:0 10px;height:32px}
.menu>button:hover,.menu.open>button{background:var(--hover)}
.dropdown{display:none;position:absolute;top:32px;left:0;min-width:300px;background:var(--dd-bg);border:1px solid var(--dd-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 0}
.menu.open .dropdown{display:block}
.dropdown button{display:grid;grid-template-columns:18px 1fr auto;align-items:center;width:100%;background:none;border:0;padding:5px 16px 5px 8px;text-align:left}
.dropdown button:hover{background:var(--dd-hover-bg);color:var(--dd-hover-fg)}
.dropdown button:disabled{opacity:.4}.dropdown button:disabled:hover{background:none;color:inherit}
.dropdown kbd{color:var(--dim);font:inherit;padding-left:24px}
.dropdown button:hover kbd{color:inherit;opacity:.8}
.dropdown .chk{font-size:11px}
.dropdown hr{border:0;border-top:1px solid var(--dd-border);margin:4px 0}
.dropdown .dd-label{padding:6px 16px 2px 26px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.apptitle{flex:1;text-align:center;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.cta{margin-right:10px;height:24px;padding:0 16px;border-radius:var(--cta-radius);border:0;background:var(--cta);color:var(--on-accent);font-weight:600}
.cta:hover{background:var(--cta-hover)}

/* Options bar */
.optbar{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--chrome2);border-bottom:1px solid var(--line);overflow:hidden}
.group{display:flex;align-items:center;gap:4px;padding:0 6px;border-right:1px solid var(--border)}
.group:last-child{border-right:0}
.spacer,.flex{flex:1}
.ibtn{height:28px;min-width:28px;padding:0 6px;background:none;border:1px solid transparent;border-radius:var(--radius);display:inline-grid;place-items:center}
.ibtn:hover{background:var(--hover)}
.ibtn.active{background:var(--btn-active-bg);border-color:var(--btn-active-border);color:var(--strong)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:disabled,.btn-sm:disabled,.cta:disabled,select:disabled,input:disabled{opacity:.35;pointer-events:none}
select{background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);height:26px;padding:0 6px;font:inherit;outline:0}
select:focus,input:focus{border-color:var(--accent)}
.ibtn.txt{font-size:14px}
.cbtn{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-weight:700}
.cbtn svg{width:14px;height:14px}
.cbtn i{display:block;width:16px;height:3px;margin-top:2px;border-radius:1px;border:1px solid var(--input-border)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:8px;width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2}
.search input{padding-left:28px;width:260px}
.seg{display:inline-flex;border:1px solid var(--input-border);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--seg-bg);border:0;border-right:1px solid var(--input-border);padding:0 14px;height:26px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button.active{background:var(--seg-active);color:var(--strong);font-weight:600}
.field-in{background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);height:26px;padding:0 8px;font:inherit;outline:0}
.btn-sm{height:26px;padding:0 12px;border-radius:var(--btn-radius);border:1px solid var(--input-border);background:none}
.btn-sm:hover{background:var(--hover)}
.btn-sm.primary{background:var(--cta);border-color:var(--cta);color:var(--on-accent);font-weight:600}
.btn-sm.primary:hover{background:var(--cta-hover)}

/* Main layout */
.main{display:grid;grid-template-columns:44px 1fr auto;min-height:0;overflow:clip}
.tools{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px;overflow-y:auto}
.tools .ibtn{width:34px;height:32px}
.tools .sep{width:22px;height:1px;background:var(--border);margin:4px 0;flex:none}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:clip}
.tabs{display:flex;height:30px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--dim);background:var(--tab-bg);min-width:130px;max-width:240px;cursor:default}
.tab:hover{color:var(--text)}
.tab.active{background:var(--tab-active);color:var(--strong);box-shadow:var(--tab-ind)}
.tab-ico{font-size:9px;font-weight:700;color:#2fc48d;border:1px solid currentColor;border-radius:3px;padding:0 3px;text-transform:uppercase}
.tab .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.dirty .name::after{content:" \25CF";color:var(--accent)}
.tab .x{background:none;border:0;width:20px;height:20px;border-radius:3px;font-size:10px;opacity:0}
.tab:hover .x,.tab.active .x{opacity:.8}.tab .x:hover{background:var(--hover);opacity:1}
.tab-new{background:none;border:0;width:30px;font-size:16px;color:var(--dim)}.tab-new:hover{color:var(--strong);background:var(--hover)}
.work{flex:1;display:flex;flex-direction:column;min-height:0}
.work.mode-chart .grid-wrap,.work.mode-table .chart-pane{display:none}
.work.mode-split .grid-wrap{flex:0 0 55%}
.grid-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.chart-pane{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--grid-bg);border-top:1px solid var(--line)}
.chart-head{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--grid-line);color:var(--dim)}
.chart-box{flex:1;min-height:0;position:relative;padding:12px 16px}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:24px}

/* Data grid (virtualized) */
.grid{flex:1;overflow:auto;position:relative;background:var(--grid-bg);outline:0;--rh:26px;font-variant-numeric:tabular-nums}
body.compact .grid{--rh:22px}
.g-inner{position:relative}
.g-head{position:sticky;top:0;z-index:3;background:var(--grid-head)}
.g-hrow{display:flex;height:30px;border-bottom:1px solid var(--grid-line)}
.g-frow{display:flex;height:28px;border-bottom:1px solid var(--grid-line);background:var(--grid-head)}
.g-row{position:absolute;left:0;display:flex;height:var(--rh)}
.g-row:nth-child(even){background:var(--grid-alt)}
.g-cell{flex:none;height:var(--rh);line-height:var(--rh);padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);cursor:cell}
.g-cell.num{text-align:right}
.g-cell.empty{color:var(--dim)}
.g-cell.sel{background:var(--sel)}
.g-cell.focus{box-shadow:inset 0 0 0 2px var(--sel-line)}
.g-num{position:sticky;left:0;z-index:2;flex:none;width:var(--numw,56px);background:var(--grid-num);color:var(--dim);text-align:right;padding:0 8px;height:var(--rh);line-height:var(--rh);border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);cursor:default;font-size:11px}
.g-num.sel{color:var(--accent);font-weight:700;background:var(--sel)}
.g-corner{position:sticky;left:0;z-index:4;flex:none;width:var(--numw,56px);background:var(--grid-head);border-right:1px solid var(--grid-line)}
.g-th{flex:none;position:relative;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;border-right:1px solid var(--grid-line);font-weight:600;color:var(--strong);overflow:hidden;cursor:default}
.g-th.sel{background:var(--sel)}
.g-th .tname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-th .ttype{font-size:9px;font-weight:700;color:var(--dim);border:1px solid var(--grid-line);border-radius:3px;padding:0 3px;flex:none}
.g-th .tsort{background:none;border:0;padding:2px;width:20px;height:20px;border-radius:3px;color:var(--dim);flex:none;display:grid;place-items:center}
.g-th .tsort:hover{background:var(--hover);color:var(--strong)}
.g-th .tsort.on{color:var(--accent)}
.g-th .tsort svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.g-th .resize{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.g-th .resize:hover{background:var(--accent)}
.g-fcell{flex:none;padding:3px 4px;border-right:1px solid var(--grid-line)}
.g-fcell input{width:100%;height:21px;font:inherit;font-size:11px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:3px;padding:0 6px;outline:0}
.g-fcell input:focus{border-color:var(--accent)}
.g-fcell input.on{border-color:var(--accent);background:var(--sel)}
.fxbar{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;background:var(--grid-head);border-bottom:1px solid var(--grid-line);flex:none}
#fxRef{min-width:58px;padding:0 6px;font:600 12px Consolas,monospace;color:var(--strong);border-right:1px solid var(--grid-line)}
.fx-i{font:italic 13px Georgia,serif;color:var(--dim);cursor:pointer}.fx-i:hover{color:var(--accent)}
/* Formula assist: suggestions + syntax, outlined references, function list */
.fx-help{position:fixed;z-index:60;max-width:460px;min-width:260px;background:var(--panel);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:12px;color:var(--text);overflow:hidden}
.fx-list{border-bottom:1px solid var(--border);padding:3px 0}
.fx-item{display:flex;gap:10px;align-items:baseline;padding:3px 10px;cursor:pointer;white-space:nowrap}
.fx-item b{font-family:Consolas,monospace;color:var(--strong);min-width:92px}
.fx-item span{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.fx-item.sel,.fx-item:hover{background:var(--hover)}.fx-item.sel b{color:var(--accent)}
.fx-sig{font-family:Consolas,monospace;padding:6px 10px 2px;color:var(--text)}.fx-sig b{color:var(--accent)}
.fx-desc{padding:0 10px 6px;color:var(--dim)}
.fx-foot{padding:4px 10px;border-top:1px solid var(--border);color:var(--dim);font-size:11px}
.g-cell u{text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-skip-ink:none}
.g-cell u.sp{text-decoration-color:#e5484d}.g-cell u.gr{text-decoration-color:#3d8ee8}
.st-spell{cursor:pointer}.st-spell.has{color:#e5a100}
.g-cell.fx-ref{box-shadow:inset 0 0 0 2px var(--fxc)}
.g-cell.k0{--fxc:#3d8ee8}.g-cell.k1{--fxc:#e8710a}.g-cell.k2{--fxc:#b073e0}.g-cell.k3{--fxc:#2bb3a3}.g-cell.k4{--fxc:#d65b8b}.g-cell.k5{--fxc:#c28a2c}
#fnSearch{width:100%;margin:4px 0 8px}
.modal.fnwide{width:min(760px,94vw)}
.fn-list{max-height:56vh;overflow:auto}.fn-list h4{margin:12px 0 4px}
.fn-row{padding:4px 0 8px;border-bottom:1px solid var(--border)}.fn-row .fx-sig,.fn-row .fx-desc{padding-left:0}
.fn-row code{font:12px Consolas,monospace;color:var(--dim)}
#fxIn{flex:1;height:22px;font:12px Consolas,"Cascadia Code",monospace;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:3px;padding:0 8px;outline:0}
#fxIn:focus{border-color:var(--accent)}
.g-cell.err{color:var(--danger)}
.cell-edit{position:absolute;z-index:5;font:inherit;padding:0 7px;border:2px solid var(--sel-line);background:var(--grid-bg);color:var(--strong);outline:0;box-shadow:var(--shadow)}
.grid-empty{position:absolute;left:0;right:0;top:80px;text-align:center;color:var(--dim)}
.sheets{display:flex;height:28px;flex:none;background:var(--chrome);border-top:1px solid var(--line);overflow-x:auto}
.sheets button{background:none;border:0;border-right:1px solid var(--line);padding:0 14px;color:var(--dim)}
.sheets button:hover{color:var(--text);background:var(--hover)}
.sheets button.active{color:var(--strong);background:var(--grid-bg);box-shadow:inset 0 -2px var(--accent2);font-weight:600}

/* Empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--workarea);padding:24px;text-align:center}
.empty-state .big-tile{width:112px;height:112px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));display:grid;place-items:center;color:#fff;font-weight:800;font-size:44px;letter-spacing:-.03em;box-shadow:0 12px 32px rgba(18,160,107,.35)}
.empty-state h1{margin:0;font-size:22px;font-weight:650;color:var(--strong)}
.empty-state p{margin:0;color:var(--dim);font-size:13px;max-width:560px}
.empty-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.recent{display:flex;flex-direction:column;gap:2px;min-width:360px;max-width:560px;margin-top:8px;text-align:left}
.recent .sect{margin-bottom:4px}
.recent button{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:var(--radius);padding:7px 10px;text-align:left}
.recent button:hover{background:var(--hover)}
.recent small{color:var(--dim);margin-left:auto;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl}

/* Dock */
.dock{width:320px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dock.hidden{display:none}
.dock-tabs{display:flex;background:var(--chrome);border-bottom:1px solid var(--line);height:30px;flex:none}
.dock-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:0 12px;font-weight:600}
.dock-tabs button:hover{color:var(--text)}
.dock-tabs button.active{color:var(--strong);border-bottom-color:var(--dock-ind)}
.dock-body{flex:1;overflow:auto;padding:10px 12px}
.dpanel{display:none}.dpanel.active{display:block}
.sect{margin:12px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.empty{color:var(--dim);padding:20px 8px;text-align:center;line-height:1.7}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.kv span{color:var(--dim);flex:none}
.kv b{font-weight:500;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.col-title{font-size:15px;font-weight:650;color:var(--strong);margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar b{font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.bar i{grid-column:1/-1;display:block;height:4px;border-radius:2px;background:var(--accent2)}
.field{margin:10px 0}.field>label{display:block;color:var(--dim);margin-bottom:5px}
.field select{width:100%}
.checks{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;border:1px solid var(--input-border);border-radius:var(--radius);padding:6px 8px;background:var(--input-bg)}
.checks label{display:flex;gap:8px;align-items:center}
.checks input{accent-color:var(--accent2)}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer}
.switch input{display:none}
.switch span{width:26px;height:14px;border-radius:7px;background:var(--switch-off);position:relative;transition:.15s;flex:none}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--accent2)}
.switch input:checked+span::after{left:14px}

/* Status bar */
.status{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--chrome);border-top:1px solid var(--line);color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.st-state::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.st-state.dirty::before{background:var(--warn)}
.st-state:empty::before{display:none}

/* Overlays */
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:var(--dd-bg);color:var(--strong);padding:8px 16px;border-radius:var(--radius);
  border:1px solid var(--dd-border);border-left:4px solid var(--accent);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:300;max-width:70vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;place-items:center;z-index:200}
.modal-bg.show{display:grid}
.modal{width:min(560px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--modal-bg);border:1px solid var(--dd-border);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow)}
.modal.wide{width:min(860px,94vw);height:min(600px,88vh)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:16px;font-weight:600;color:var(--strong);border-bottom:1px solid var(--border)}
.modal-body{padding:16px 20px;overflow:auto;line-height:1.6;flex:1;min-height:0}
.modal.wide .modal-body{padding:0;overflow:hidden}
.modal-body table{width:100%;border-collapse:collapse}
.modal-body td{padding:4px 6px;border-bottom:1px solid var(--border)}
.modal-body td:last-child{text-align:right}
.modal-body kbd{background:var(--code-bg);border:1px solid var(--input-border);border-radius:3px;padding:1px 6px;font:11px Consolas,monospace}
.modal-body h4{margin:16px 0 6px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.modal-body a{color:var(--accent)}
.modal-body .field-in{width:100%}
.fmt-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.fmt-list label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--input-border);border-radius:var(--radius);padding:8px 10px;cursor:pointer}
.fmt-list label:has(input:checked){border-color:var(--accent);background:var(--sel)}
.fmt-list small{display:block;color:var(--dim)}
.fmt-list input{accent-color:var(--accent2);margin-top:3px}
.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.modal-foot[hidden]{display:none}
.prefs{display:grid;grid-template-columns:180px 1fr;height:100%}
.prefs nav{border-right:1px solid var(--border);padding:12px 8px;background:var(--panel)}
.prefs nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:var(--radius);margin-bottom:2px}
.prefs nav button:hover{background:var(--hover)}
.prefs nav button.active{background:var(--dd-hover-bg);color:var(--dd-hover-fg);font-weight:600}
.prefs section{padding:4px 26px 24px;overflow:auto}
.prefs h3{font-size:12px;font-weight:600;color:var(--strong);margin:20px 0 8px}
.prefs .hint{color:var(--dim);margin:-2px 0 10px}
.wide-sel{width:280px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px}
.theme-card{padding:0;border:2px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card-bg);text-align:left;cursor:pointer}
.theme-card:hover{border-color:var(--dim)}
.theme-card.active{border-color:var(--accent)}
.theme-name{display:flex;justify-content:space-between;padding:8px 12px;font-weight:600;color:var(--strong)}
.theme-name span{color:var(--accent)}
.tc-mock{height:112px;display:grid;grid-template-rows:16px 1fr;background:var(--bg);pointer-events:none}
.tc-bar{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 7px}
.tc-bar i{width:16px;height:4px;border-radius:2px;background:var(--dim);opacity:.7}
.tc-bar b{margin-left:auto;width:22px;height:8px;border-radius:4px;background:var(--cta)}
.tc-body{display:grid;grid-template-columns:14px 1fr 46px;min-height:0}
.tc-rail{background:var(--chrome);border-right:1px solid var(--line)}
.tc-grid{background:var(--grid-bg);display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:12px}
.tc-grid i{border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line)}
.tc-grid i.h{background:var(--grid-head)}
.tc-dock{background:var(--panel);border-left:1px solid var(--line)}
.drop{position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:10px;background:rgba(10,60,40,.75);display:none;place-items:center;font-size:20px;color:#fff;z-index:250;pointer-events:none}
.drop.show{display:grid}
</style>
</head>
<body>

<header class="menubar">
  <div class="logo"><span>Dt</span></div>
  <nav id="menus"></nav>
  <div class="apptitle" id="apptitle">Data Studio</div>
  <button class="cta" data-act="save" data-i18n="ui.save">Save</button>
</header>

<div class="optbar">
  <div class="group" id="fileBtns"></div>
  <input type="color" id="fcPick" hidden><input type="color" id="bgPick" value="#ffff00" hidden>
  <div class="group">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="field-in" id="globalSearch" data-i18n-ph="ui.searchRows" spellcheck="false"></label>
  </div>
  <div class="spacer"></div>
  <div class="group"><div class="seg" id="viewSeg"></div></div>
  <div class="group" id="viewBtns"></div>
</div>

<div class="main">
  <aside class="tools" id="tools"></aside>
  <section class="center">
    <div class="tabs" id="tabs"></div>
    <div class="work mode-table" id="work" hidden>
      <div class="grid-wrap">
        <div class="fxbar"><span id="fxRef"></span><span class="fx-i">fx</span><input id="fxIn" spellcheck="false" data-i18n-ph="ui.fxPh"></div>
        <div class="grid" id="grid" tabindex="0"><div class="g-inner" id="gInner"></div></div>
        <div class="sheets" id="sheets" hidden></div>
      </div>
      <div class="chart-pane">
        <div class="chart-head"><span id="chartTitle"></span><span class="flex"></span>
          <button class="btn-sm" data-act="exportChart" data-i18n="ui.saveChart"></button></div>
        <div class="chart-box"><canvas id="chart"></canvas><div class="chart-empty" id="chartEmpty"></div></div>
      </div>
    </div>
    <div class="empty-state" id="emptyState">
      <div class="big-tile">Dt</div>
      <h1 data-i18n="ui.emptyTitle"></h1>
      <p data-i18n="ui.emptyHint"></p>
      <div class="empty-actions">
        <button class="btn-sm primary" data-act="openFile" data-i18n="a.openFile"></button>
        <button class="btn-sm" data-act="newTable" data-i18n="a.newTable"></button>
      </div>
      <div class="recent" id="recent"></div>
    </div>
  </section>
  <aside class="dock" id="dock">
    <div class="dock-tabs" id="dockTabs">
      <button data-tab="column" data-i18n="ui.column"></button>
      <button data-tab="chart" data-i18n="ui.chart"></button>
      <button data-tab="props" data-i18n="ui.properties"></button>
    </div>
    <div class="dock-body" id="dockBody">
      <div class="dpanel" data-panel="column"><div id="colPanel"></div></div>
      <div class="dpanel" data-panel="chart"><div id="chartPanel"></div></div>
      <div class="dpanel" data-panel="props"><div id="props"></div></div>
    </div>
  </aside>
</div>

<footer class="status">
  <span id="stState" class="st-state"></span>
  <span id="stRows"></span>
  <span id="stCell"></span>
  <span class="flex"></span>
  <span id="stSpell" class="st-spell" role="button" hidden></span>
  <span id="stSel"></span>
  <span id="stFormat"></span>
  <span id="stSize"></span>
</footer>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal">
  <div class="modal-head"><span id="modalTitle"></span><button class="ibtn" id="modalClose">&#10005;</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot" hidden></div>
</div></div>
<div class="drop" id="drop" data-i18n="ui.drop"></div>
<input type="file" id="fileIn" multiple hidden>

<script src="formula.js"></script>
<script src="xformat.js"></script>
<script src="native.js"></script>
<script src="autohide.js"></script>
<script src="shortcuts.js"></script>
<script src="loadbar.js"></script>
<script src="app.js"></script>
</body>
